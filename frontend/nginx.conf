server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # 构建产物文件名带内容哈希，文件名即版本号，因此可以长期缓存；
    # 但文件缺失时必须返回 404，绝不能回退到 index.html：
    # 前端动态 import 若拿到 HTML 会抛 SyntaxError，导致路由导航永久挂起。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 是整套资源的清单，必须每次向服务器验证，
    # 否则浏览器会沿用旧清单去请求已不存在的旧 chunk。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 前端路由回退：真实路径不存在时交给 SPA 接管，用于支持直接访问 /songs 这类地址。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
