<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="智能数据平台">
  <title>智能数据平台</title>
  <!-- 目录卡：卡片上三孔编号，右下角一枚索引点。
       孔位宽到能在 16px 标签页里各自成形；索引点故意不对称，避免变成通用圆角方块。 -->
  <rect width="64" height="64" rx="13" fill="#16233a"/>
  <rect x="13" y="16" width="34" height="28" rx="5.5" fill="#6ee7d2"/>
  <g fill="#16233a">
    <rect x="17.5" y="21" width="6" height="18" rx="2.6"/>
    <rect x="27" y="21" width="6" height="18" rx="2.6"/>
    <rect x="36.5" y="21" width="6" height="18" rx="2.6"/>
  </g>
  <circle cx="51" cy="49" r="4" fill="#38bfae"/>
</svg>
