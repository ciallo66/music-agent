name: Publish Docker images
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: docker.cnb.cool/my-repo-26633/music-agent/backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: docker.cnb.cool/my-repo-26633/music-agent/frontend:latest
      - name: Mirror pgvector image to GHCR
        run: |
          docker pull pgvector/pgvector:pg16
          docker tag pgvector/pgvector:pg16 docker.cnb.cool/my-repo-26633/music-agent/pgvector:pg16
          docker push docker.cnb.cool/my-repo-26633/music-agent/pgvector:pg16

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: docker-compose.yml
          target: /opt/music-agent
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: CNB_TOKEN
          script_stop: true
          script: |
            cd /opt/music-agent
            echo "$CNB_TOKEN" | docker login docker.cnb.cool -u cnb --password-stdin
            docker compose --env-file .env.production pull
            docker compose --env-file .env.production up -d
            docker image prune -f
