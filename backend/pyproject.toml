[project]
name = "music-agent"
version = "0.1.0"
description = "AI 音乐发现平台 —— 多用户音乐推荐 + AI 辅助 + RAG"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.46",
    "alembic==1.19.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "ddgs==9.16.0",  # 联网搜索（DuckDuckGo），要求 Python >= 3.10
    "PyJWT==2.13.0",
    "pwdlib[argon2]==0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=0.24",
    "httpx2==2.12.0",  # Starlette TestClient 优先使用，避免旧 httpx 兼容层警告
    "ruff==0.6.9",   # 与 .pre-commit-config.yaml 的 ruff 版本保持一致
    "mypy==1.10.1",  # 与 .pre-commit-config.yaml 的 mypy 版本保持一致
    "pre-commit>=3.7",
]

# 显式声明后端应用包。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes（格式、未使用导入、星号导入）
    "I",               # import 排序
    "N",               # 命名（snake_case 函数 / PascalCase 类）
    "UP",              # 现代写法（Optional[int] → int | None 等）
    "B",               # bugbear（常见逻辑 bug）
    "SIM",             # 简化
    "C901",            # 圈复杂度，配合 max-complexity 卡超长/超复杂函数
    "D100", "D101", "D102", "D103", "D104",  # 强制 public 模块/类/方法/函数/包带 docstring
    "RUF",             # ruff 专用（含清除无效 noqa）
]
# 中文 docstring 天然用全角标点，RUF001/002/003（歧义字符）会误报，排除
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
