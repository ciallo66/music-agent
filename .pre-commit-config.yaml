# pre-commit 钩子：每次 git commit 强制检查，不合规的代码进不了仓库
# 安装：pip install pre-commit && pre-commit install
#
# ⚠️ 重要：Python 工具规则来自 backend/pyproject.toml。改规则时必须一起提交，
#    否则 pre-commit 运行期间会临时还原未暂存改动，ruff 用旧配置导致新规则不生效。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --config, backend/pyproject.toml]
      - id: ruff-format
        args: [--config, backend/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]
        args: ["--ignore-missing-imports", "--config-file=backend/pyproject.toml"]
