[project]
name = "music-agent"
version = "0.1.0"
description = "AI 音乐发现平台 —— 多用户音乐推荐 + AI 辅助 + RAG"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.46",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# E/F/W: pycodestyle + pyflakes; I: import 排序; N: 命名; UP: 升级到现代写法; B: bugbear; SIM: 简化

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
